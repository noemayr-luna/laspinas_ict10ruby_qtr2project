    <script type="py">
from pyscript import when, document
from js import window

@when("click", "a")
def thank_you(event):
    event.preventDefault()

    link = event.currentTarget.href
    new_tab = event.currentTarget.target == "_blank"

    document.querySelector("#message").innerText = "Awwh, thanks for clicking!"

    def redirect():
        if new_tab:
            window.open(link, "_blank")
        else:
            window.location.assign(link)

    window.setTimeout(redirect, 1500)
